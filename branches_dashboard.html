<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Branches of Mathematics — by decade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        #0B0B0C;
    --bg-panel:  #111114;
    --bg-row:    #15151A;
    --line:      #23232A;
    --line-2:    #1A1A20;
    --fg:        #E8E4DC;
    --fg-mute:   #8A857C;
    --fg-dim:    #5A554E;
    --accent:    #E5B567;
    --accent-2:  #B89B5E;

    --c-found:   #C97B7B;
    --c-alg:     #E5B567;
    --c-grp:     #9B7BB8;
    --c-an:      #7BA8C9;
    --c-geo:     #8FA876;
    --c-prob:    #C9956A;
    --c-app:     #6A8E8C;
    --c-or:      #B58FB2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(229,181,103,0.04), transparent 60%),
      linear-gradient(var(--bg), var(--bg));
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 40px 36px 80px 36px; }

  /* Header */
  header.head {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 32px 0 28px 0;
    margin-bottom: 36px;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 40px;
    align-items: end;
  }
  @media (max-width: 880px) { header.head { grid-template-columns: 1fr; } }
  .head h1 {
    font-family: "IBM Plex Serif", serif;
    font-weight: 400; font-size: 30px;
    letter-spacing: -0.01em; margin: 0 0 8px 0; color: var(--fg);
  }
  .head h1 em { font-style: italic; color: var(--accent); }
  .head .subtitle { color: var(--fg-mute); font-size: 12px; letter-spacing: 0.02em; }
  .head .crumb {
    font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--fg-dim); margin-bottom: 14px;
  }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
    border-left: 1px solid var(--line); padding-left: 28px;
  }
  @media (max-width: 880px) { .stats { border-left: 0; padding-left: 0; } }
  .stat .v {
    font-family: "IBM Plex Serif", serif;
    font-size: 26px; font-weight: 400; color: var(--fg); line-height: 1;
  }
  .stat .v.accent { color: var(--accent); }
  .stat .k {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-mute); margin-top: 6px;
  }

  section.block { margin-bottom: 56px; }
  .block-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
    gap: 16px;
  }
  .block-head .num { font-size: 10px; letter-spacing: 0.18em; color: var(--fg-dim); }
  .block-head h2 {
    font-family: "IBM Plex Serif", serif; font-weight: 400;
    font-size: 18px; margin: 0; color: var(--fg);
  }
  .block-head .h-meta { color: var(--fg-mute); font-size: 11px; }

  /* Timeline */
  .timeline-wrap {
    background: var(--bg-panel); border: 1px solid var(--line);
    padding: 24px 22px 18px 22px;
  }
  .timeline-svg { width: 100%; height: 360px; display: block; }
  .timeline-svg text { font-family: "JetBrains Mono", monospace; }
  .timeline-svg .axis { fill: var(--fg-mute); font-size: 10px; }
  .timeline-svg .axis-strong { fill: var(--fg); font-size: 10px; }
  .timeline-svg .grid { stroke: var(--line-2); stroke-width: 1; }
  .timeline-svg .grid-strong { stroke: var(--line); stroke-width: 1; }
  .timeline-svg .anno { fill: var(--fg-mute); font-size: 10px; }
  .timeline-svg .anno-num { fill: var(--accent); font-size: 11px; font-weight: 600; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 14px 18px;
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid var(--line-2);
    font-size: 11px; color: var(--fg-mute);
  }
  .legend .item { display: flex; align-items: center; gap: 7px; cursor: pointer; opacity: 0.85; }
  .legend .item.dim { opacity: 0.35; }
  .legend .item:hover { opacity: 1; }
  .legend .sw { width: 10px; height: 10px; border-radius: 2px; }

  .row2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; }
  @media (max-width: 980px) { .row2 { grid-template-columns: 1fr; } }

  .bars { background: var(--bg-panel); border: 1px solid var(--line); padding: 18px 20px; }
  .bar-row {
    display: grid; grid-template-columns: 1fr 36px;
    align-items: center; gap: 12px;
    padding: 6px 0; border-bottom: 1px dashed var(--line-2);
    font-size: 12px;
  }
  .bar-row:last-child { border-bottom: 0; }
  .bar-label { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .bar-label .code { color: var(--fg-dim); min-width: 28px; }
  .bar-label .name { flex: 0 0 auto; white-space: nowrap; }
  .bar-label .bar-track {
    flex: 1 1 auto; height: 4px; background: var(--line-2);
    position: relative;
  }
  .bar-label .bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent);
  }
  .bar-row .count {
    text-align: right; color: var(--fg-mute);
    font-variant-numeric: tabular-nums;
  }

  .founders {
    background: var(--bg-panel); border: 1px solid var(--line); padding: 18px 20px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 36px;
  }
  @media (max-width: 880px) { .founders { grid-template-columns: 1fr; } }
  .founder-row {
    display: grid; grid-template-columns: 22px 1fr 26px;
    align-items: baseline; padding: 6px 0;
    border-bottom: 1px dashed var(--line-2); font-size: 12px;
  }
  .founder-row .rank { color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  .founder-row .nm { color: var(--fg); }
  .founder-row .ct {
    text-align: right; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .filters select, .filters input {
    background: var(--bg-panel); border: 1px solid var(--line);
    color: var(--fg); font-family: inherit; font-size: 12px;
    padding: 7px 10px; outline: none;
  }
  .filters input { min-width: 220px; }
  .filters select:focus, .filters input:focus { border-color: var(--accent); }
  .filters .reset {
    background: transparent; border: 1px solid var(--line);
    color: var(--fg-mute); font-family: inherit; font-size: 11px;
    padding: 7px 12px; cursor: pointer; letter-spacing: 0.06em;
  }
  .filters .reset:hover { color: var(--fg); border-color: var(--fg-mute); }
  .filters .count-info { margin-left: auto; color: var(--fg-mute); font-size: 11px; }

  table.entries { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.entries thead th {
    text-align: left; font-weight: 400;
    color: var(--fg-mute); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 10px 10px; border-bottom: 1px solid var(--line);
    background: var(--bg-panel);
  }
  table.entries tbody tr.entry { border-bottom: 1px solid var(--line-2); cursor: pointer; }
  table.entries tbody tr.entry:hover { background: var(--bg-row); }
  table.entries tbody tr.entry.open { background: var(--bg-row); }
  table.entries td { padding: 9px 10px; vertical-align: top; }
  td.yr { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.msc { color: var(--fg-mute); font-size: 11px; white-space: nowrap; }
  td.nm { color: var(--fg); }
  td.fd { color: var(--fg-mute); }
  td.rg { color: var(--fg-mute); }
  td.ar { white-space: nowrap; }
  td.ar .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  td.ar .ar-label { color: var(--fg-mute); font-size: 11px; }

  tr.detail-row td { padding: 0; }
  .detail {
    padding: 14px 18px 18px 18px;
    background: #0E0E12;
    border-left: 2px solid var(--accent);
    margin: 4px 0 8px 0;
  }
  .detail .desc { color: var(--fg); font-size: 12.5px; line-height: 1.65; margin-bottom: 12px; }
  .detail .meta {
    display: grid; grid-template-columns: 140px 1fr;
    gap: 4px 16px; color: var(--fg-mute); font-size: 11.5px;
  }
  .detail .meta .lbl {
    color: var(--fg-dim); text-transform: uppercase;
    letter-spacing: 0.1em; font-size: 10px; padding-top: 2px;
  }
  .detail .meta .val { color: var(--fg); }
  .detail .meta .val em { color: var(--fg-mute); font-style: italic; }
  .detail .alts {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 11px; color: var(--fg-mute);
  }
  .detail .alts-head {
    color: var(--fg-dim); text-transform: uppercase;
    letter-spacing: 0.1em; font-size: 10px; margin-bottom: 4px;
  }
  .detail .alts .a-row { margin: 3px 0; }
  .detail .alts .a-y {
    color: var(--accent-2); font-variant-numeric: tabular-nums; margin-right: 6px;
  }

  .empty { padding: 30px 10px; text-align: center; color: var(--fg-mute); font-size: 12px; }

  footer.foot {
    margin-top: 60px; padding-top: 22px; border-top: 1px solid var(--line);
    color: var(--fg-mute); font-size: 11px; line-height: 1.7;
  }
  footer.foot strong { color: var(--fg); }
  footer.foot ul { padding-left: 18px; margin: 4px 0; }
  footer.foot li { margin: 3px 0; }

  /* tooltip box on timeline */
  .tt-box { fill: #16161B; stroke: var(--line); }
</style>
</head>

rators, structure-preserving algorithms, computer-assisted proofs.","sources":[{"author":"Hairer-Lubich-Wanner","work":"Geometric Numerical Integration","year":2002,"url":"https://en.wikipedia.org/wiki/Symplectic_integrator"}],"decade":"1990s"},{"id":"46S","name":"Other (nonclassical) types of functional analysis","msc_code":"46S","parent_top_msc":"46","parent_branch":"Functional analysis","year":1990,"founders":["Alain Connes"],"founding_work":"Géométrie non commutative","region":"France","description":"Quantum, p-adic, fuzzy, noncommutative functional analysis.","sources":[{"author":"Connes","work":"Géométrie non commutative","year":1990,"url":"https://en.wikipedia.org/wiki/Noncommutative_geometry"}],"decade":"1990s"},{"id":"30L","name":"Analysis on metric spaces","msc_code":"30L","parent_top_msc":"30","parent_branch":"Functions of a complex variable","year":1995,"founders":["Juha Heinonen","Pekka Koskela"],"founding_work":"Quasiconformal maps in metric spaces of controlled geometry","region":"Finland","description":"Quasiconformal/Sobolev analysis on metric measure spaces.","sources":[{"author":"Heinonen-Koskela","work":"Quasiconformal maps in metric spaces...","year":1998,"url":"https://en.wikipedia.org/wiki/Analysis_on_metric_spaces"}],"decade":"1990s"},{"id":"60L","name":"Rough analysis (rough paths, regularity structures)","msc_code":"60L","parent_top_msc":"60","parent_branch":"Probability theory and stochastic processes","year":1998,"founders":["Terry Lyons"],"founding_work":"Differential equations driven by rough signals","region":"United Kingdom","description":"Rough paths, regularity structures, singular SPDEs.","alternatives":[{"year":2014,"founder":"Martin Hairer","work":"A theory of regularity structures"}],"sources":[{"author":"Lyons","work":"Differential equations driven by rough signals","year":1998,"url":"https://en.wikipedia.org/wiki/Rough_path"}],"decade":"1990s"}],"2000s":[{"id":"55U","name":"Applied homological algebra and category theory","msc_code":"55U","parent_top_msc":"55","parent_branch":"Algebraic topology","year":2000,"founders":["Gunnar Carlsson"],"founding_work":"Topology and data (preprint era)","region":"United States","description":"Homological methods, persistent homology, computational topology.","sources":[{"author":"Carlsson","work":"Topology and data","year":2009,"url":"https://en.wikipedia.org/wiki/Topological_data_analysis"}],"decade":"2000s"},{"id":"31E","name":"Potential theory on metric spaces","msc_code":"31E","parent_top_msc":"31","parent_branch":"Potential theory","year":2001,"founders":["Juha Heinonen"],"founding_work":"Lectures on Analysis on Metric Spaces","region":"Finland","description":"Dirichlet forms and potentials on metric measure spaces.","sources":[{"author":"Heinonen","work":"Lectures on Analysis on Metric Spaces","year":2001,"url":"https://en.wikipedia.org/wiki/Analysis_on_metric_spaces"}],"decade":"2000s"},{"id":"14T","name":"Tropical geometry","msc_code":"14T","parent_top_msc":"14","parent_branch":"Algebraic geometry","year":2002,"founders":["Grigory Mikhalkin"],"founding_work":"Counting curves via lattice paths and tropical curves","region":"Russia/Canada","description":"Piecewise-linear shadows of algebraic varieties; tropical curves and intersection.","alternatives":[{"year":1980,"founder":"Imre Simon","work":"Limited subsets of a free monoid","note":"tropical semiring origins"}],"sources":[{"author":"Mikhalkin","work":"Counting curves via lattice paths and tropical curves","year":2002,"url":"https://en.wikipedia.org/wiki/Tropical_geometry"}],"decade":"2000s"},{"id":"37P","name":"Arithmetic and non-Archimedean dynamics","msc_code":"37P","parent_top_msc":"37","parent_branch":"Dynamical systems and ergodic theory","year":2007,"founders":["Joseph Silverman"],"founding_work":"The Arithmetic of Dynamical Systems","region":"United States","description":"Heights, preperiodic points, p-adic dynamics, Zariski-dense orbits.","sources":[{"author":"Silverman","work":"The Arithmetic of Dynamical Systems","year":2007,"url":"https://en.wikipedia.org/wiki/Arithmetic_dynamics"}],"decade":"2000s"},{"id":"62Q","name":"Statistics in computational topology","msc_code":"62Q","parent_top_msc":"62","parent_branch":"Statistics","year":2007,"founders":["Peter Bubenik","Peter T. Kim","et al."],"founding_work":"Statistical topology via Morse theory persistence","region":"Canada/United States","description":"Statistical inference for persistent homology and topological summaries.","sources":[{"author":"Bubenik et al.","work":"Statistical topology via Morse theory persistence","year":2007,"url":"https://en.wikipedia.org/wiki/Topological_data_analysis"}],"decade":"2000s"}]}}</script>

<script>
"use strict";

const DATA = JSON.parse(document.getElementById('branches-data').textContent);

// ─── area mapping ─────────────────────────────────────────────────────
const AREA_DEF = [
  { key: 'found', label: 'Foundations & general algebra',    color: 'var(--c-found)', test: t => t < 11 },
  { key: 'alg',   label: 'Algebra & number theory',          color: 'var(--c-alg)',   test: t => t >= 11 && t < 20 },
  { key: 'grp',   label: 'Groups',                            color: 'var(--c-grp)',  test: t => t >= 20 && t < 26 },
  { key: 'an',    label: 'Analysis',                          color: 'var(--c-an)',   test: t => t >= 26 && t < 50 },
  { key: 'geo',   label: 'Geometry & topology',               color: 'var(--c-geo)',  test: t => t >= 50 && t < 60 },
  { key: 'prob',  label: 'Probability, statistics, numerics', color: 'var(--c-prob)', test: t => t >= 60 && t < 66 },
  { key: 'app',   label: 'Applied / mathematical physics',    color: 'var(--c-app)',  test: t => t >= 66 && t < 90 },
  { key: 'or',    label: 'OR, info & life-sciences',          color: 'var(--c-or)',   test: t => t >= 90 },
];
const AREA_BY_KEY = Object.fromEntries(AREA_DEF.map(a => [a.key, a]));
function areaOf(top) {
  const t = parseInt(top, 10);
  for (const a of AREA_DEF) if (a.test(t)) return a.key;
  return 'other';
}

// ─── flatten ──────────────────────────────────────────────────────────
const ALL = (() => {
  const out = [];
  for (const e of DATA.as_of_1420) out.push(Object.assign({}, e, { _bucket: '≤1420' }));
  for (const k of Object.keys(DATA.decades)) {
    for (const e of DATA.decades[k]) out.push(Object.assign({}, e, { _bucket: k }));
  }
  return out.map(e => Object.assign(e, { _area: areaOf(e.parent_top_msc) }));
})();

const DECADE_KEYS = ['≤1420'].concat(Object.keys(DATA.decades).sort());

// ─── derived stats ────────────────────────────────────────────────────
const decadeCounts = DECADE_KEYS.map(dk => {
  const inDec = ALL.filter(e => e._bucket === dk);
  const byArea = {};
  for (const a of AREA_DEF) byArea[a.key] = 0;
  for (const e of inDec) byArea[e._area] = (byArea[e._area] || 0) + 1;
  return { dk, total: inDec.length, byArea };
});
const MAX_DECADE = Math.max.apply(null, decadeCounts.map(d => d.total));

const areaTotals = AREA_DEF.map(a => Object.assign({}, a, {
  count: ALL.filter(e => e._area === a.key).length
})).sort((x, y) => y.count - x.count);

const branchTotals = (() => {
  const m = {};
  for (const e of ALL) {
    const k = e.parent_branch;
    if (!m[k]) m[k] = { name: k, count: 0, area: e._area, code: e.parent_top_msc };
    m[k].count++;
  }
  return Object.values(m).sort((a, b) => b.count - a.count);
})();

const regionTotals = (() => {
  const m = {};
  for (const e of ALL) {
    const r = e.region || '?';
    m[r] = (m[r] || 0) + 1;
  }
  return Object.keys(m).map(name => ({ name: name, count: m[name] }))
    .sort((a, b) => b.count - a.count);
})();

const founderTotals = (() => {
  const m = {};
  for (const e of ALL) for (const f of (e.founders || [])) m[f] = (m[f] || 0) + 1;
  return Object.keys(m).map(name => ({ name: name, count: m[name] }))
    .sort((a, b) => b.count - a.count);
})();
const TOTAL_FOUNDERS = founderTotals.length;

// ─── helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function yearLabel(y) { return y < 0 ? `${-y} BCE` : String(y); }
function el(tag, attrs, children) {
  const e = document.createElementNS(
    tag === 'svg' || tag === 'g' || tag === 'rect' || tag === 'line' || tag === 'text' || tag === 'path' || tag === 'circle'
      ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml',
    tag
  );
  if (attrs) for (const k of Object.keys(attrs)) {
    if (k === 'class') e.setAttribute('class', attrs[k]);
    else if (k === 'style') e.setAttribute('style', attrs[k]);
    else if (k.startsWith('on') && typeof attrs[k] === 'function') {
      e.addEventListener(k.slice(2), attrs[k]);
    } else {
      e.setAttribute(k, attrs[k]);
    }
  }
  if (children) {
    for (const c of [].concat(children)) {
      if (c == null || c === false) continue;
      if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
      else e.appendChild(c);
    }
  }
  return e;
}

// ─── Header ───────────────────────────────────────────────────────────
function renderHeader() {
  return `
    <header class="head">
      <div>
        <div class="crumb">FORENSIC DOSSIER · MSC2020 MID-LEVEL · COVERAGE 1420 ▸ 2007</div>
        <h1>Branches of mathematics, <em>by decade</em></h1>
        <div class="subtitle">
          ${esc(DATA.metadata.scope)}. Pre-1420 results bucketed.
          Top-level MSC codes 00, 01, 68, 97 excluded by source.
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="v accent">${DATA.metadata.entry_count}</div><div class="k">Entries</div></div>
        <div class="stat"><div class="v">${branchTotals.length}</div><div class="k">Mid-level codes</div></div>
        <div class="stat"><div class="v">${DATA.metadata.decade_count}</div><div class="k">Decades</div></div>
        <div class="stat"><div class="v">${TOTAL_FOUNDERS}</div><div class="k">Distinct founders</div></div>
      </div>
    </header>
  `;
}

// ─── Timeline (SVG, built imperatively) ───────────────────────────────
function renderTimeline(container) {
  const dimAreas = new Set();
  let hoverDk = null;

  const W = 1240, H = 360;
  const padL = 44, padR = 24, padT = 24, padB = 56;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const n = decadeCounts.length;
  const colW = innerW / n;
  const barW = Math.max(6, Math.min(28, colW * 0.62));

  const yMax = Math.ceil(MAX_DECADE / 10) * 10;
  const yTicks = [0, yMax / 4, yMax / 2, 3 * yMax / 4, yMax].map(v => Math.round(v));
  const y = v => padT + innerH * (1 - v / yMax);

  function showLabel(dk) {
    if (dk === '≤1420') return true;
    const dy = parseInt(dk, 10);
    return dy % 50 === 0 || dk === '1600s' || dk === '2000s';
  }

  // peak
  let peak = decadeCounts[0];
  for (const d of decadeCounts) if (d.total > peak.total) peak = d;
  const peakIdx = decadeCounts.indexOf(peak);

  function build() {
    container.innerHTML = '';

    const wrap = document.createElement('div');
    wrap.className = 'timeline-wrap';

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'timeline-svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('preserveAspectRatio', 'none');

    // gridlines
    yTicks.forEach((t, i) => {
      svg.appendChild(el('line', {
        x1: padL, x2: W - padR, y1: y(t), y2: y(t),
        class: i === 0 ? 'grid-strong' : 'grid'
      }));
      svg.appendChild(el('text', {
        x: padL - 8, y: y(t) + 3, class: 'axis', 'text-anchor': 'end'
      }, [String(t)]));
    });

    // bars + hit areas
    decadeCounts.forEach((d, i) => {
      const cx = padL + colW * (i + 0.5);
      const x = cx - barW / 2;
      let cursorY = y(0);

      const g = el('g', {});
      for (const a of AREA_DEF) {
        const v = d.byArea[a.key];
        if (!v) continue;
        const isDim = dimAreas.has(a.key);
        const h = (innerH * v) / yMax;
        const yTop = cursorY - h;
        const opacity = isDim ? 0.12 : (hoverDk && hoverDk !== d.dk ? 0.4 : 0.92);
        g.appendChild(el('rect', {
          x: x, y: yTop, width: barW, height: h,
          fill: a.color, opacity: opacity
        }));
        cursorY = yTop;
      }

      // total label on hover or for peak
      if (d.total > 0 && (hoverDk === d.dk || d === peak)) {
        g.appendChild(el('text', {
          x: cx, y: y(d.total) - 6,
          class: 'anno-num', 'text-anchor': 'middle'
        }, [String(d.total)]));
      }

      // hit area
      const hit = el('rect', {
        x: padL + colW * i, y: padT, width: colW, height: innerH, fill: 'transparent'
      });
      hit.addEventListener('mouseenter', () => { hoverDk = d.dk; build(); });
      hit.addEventListener('mouseleave', () => { hoverDk = null; build(); });
      g.appendChild(hit);

      // x label
      if (showLabel(d.dk)) {
        g.appendChild(el('text', {
          x: cx, y: H - padB + 18,
          class: d === peak ? 'axis-strong' : 'axis',
          'text-anchor': 'middle'
        }, [d.dk.replace('s', '')]));
      }

      svg.appendChild(g);
    });

    // peak annotation
    {
      const cx = padL + colW * (peakIdx + 0.5);
      const yPeak = y(peak.total);
      const labelY = padT + 14;
      svg.appendChild(el('line', {
        x1: cx, x2: cx, y1: yPeak - 14, y2: labelY + 6,
        stroke: 'var(--accent)', 'stroke-width': 1,
        'stroke-dasharray': '2 3', opacity: 0.6
      }));
      svg.appendChild(el('text', {
        x: cx, y: labelY, class: 'anno', 'text-anchor': 'middle',
        fill: 'var(--accent)'
      }, [`peak · ${peak.dk} · ${peak.total} new branches`]));
    }

    // tooltip
    if (hoverDk) {
      const d = decadeCounts.find(x => x.dk === hoverDk);
      const i = decadeCounts.indexOf(d);
      const cx = padL + colW * (i + 0.5);
      const lines = AREA_DEF.filter(a => d.byArea[a.key] > 0)
        .map(a => ({ a: a, v: d.byArea[a.key] }));
      const boxW = 220;
      const boxH = 22 + lines.length * 14 + 14;
      let bx = cx + 14;
      if (bx + boxW > W - padR) bx = cx - boxW - 14;
      const by = padT + 8;

      svg.appendChild(el('rect', {
        x: bx, y: by, width: boxW, height: boxH, class: 'tt-box'
      }));
      svg.appendChild(el('text', {
        x: bx + 12, y: by + 16, fill: 'var(--fg)', 'font-size': 11
      }, [`${d.dk} · ${d.total} new`]));
      lines.forEach((ln, k) => {
        svg.appendChild(el('rect', {
          x: bx + 12, y: by + 26 + k * 14, width: 8, height: 8, fill: ln.a.color
        }));
        svg.appendChild(el('text', {
          x: bx + 26, y: by + 33 + k * 14, fill: 'var(--fg-mute)', 'font-size': 10
        }, [ln.a.label]));
        svg.appendChild(el('text', {
          x: bx + boxW - 12, y: by + 33 + k * 14,
          fill: 'var(--fg)', 'font-size': 10, 'text-anchor': 'end'
        }, [String(ln.v)]));
      });
    }

    wrap.appendChild(svg);

    // legend
    const legend = document.createElement('div');
    legend.className = 'legend';
    AREA_DEF.forEach(a => {
      const item = document.createElement('div');
      item.className = 'item' + (dimAreas.has(a.key) ? ' dim' : '');
      item.title = 'click to toggle';
      item.innerHTML =
        `<div class="sw" style="background:${a.color}"></div>` +
        `<span>${esc(a.label)}</span>` +
        `<span style="color:var(--fg-dim)">· ${areaTotals.find(x => x.key === a.key).count}</span>`;
      item.addEventListener('click', () => {
        if (dimAreas.has(a.key)) dimAreas.delete(a.key); else dimAreas.add(a.key);
        build();
      });
      legend.appendChild(item);
    });
    wrap.appendChild(legend);

    container.appendChild(wrap);
  }

  build();
}

// ─── Branch bars ──────────────────────────────────────────────────────
function renderBranchBars(container) {
  const top = branchTotals.slice(0, 15);
  const max = top[0].count;
  container.innerHTML = '<div class="bars">' + top.map(b => {
    const a = AREA_BY_KEY[b.area];
    const w = (b.count / max) * 100;
    return `
      <div class="bar-row">
        <div class="bar-label">
          <span class="code">${esc(b.code)}</span>
          <span class="name">${esc(b.name)}</span>
          <div class="bar-track">
            <div class="bar-fill" style="width:${w}%; background:${a.color}; opacity:0.85"></div>
          </div>
        </div>
        <div class="count">${b.count}</div>
      </div>`;
  }).join('') + '</div>';
}

// ─── Region bars ──────────────────────────────────────────────────────
function renderRegionBars(container) {
  const top = regionTotals.slice(0, 12);
  const max = top[0].count;
  container.innerHTML = '<div class="bars">' + top.map(r => {
    const w = (r.count / max) * 100;
    return `
      <div class="bar-row">
        <div class="bar-label">
          <span class="name">${esc(r.name)}</span>
          <div class="bar-track">
            <div class="bar-fill" style="width:${w}%"></div>
          </div>
        </div>
        <div class="count">${r.count}</div>
      </div>`;
  }).join('') + '</div>';
}

// ─── Founders ─────────────────────────────────────────────────────────
function renderFounders(container) {
  const top = founderTotals.slice(0, 18);
  container.innerHTML = '<div class="founders">' + top.map((f, i) => `
    <div class="founder-row">
      <span class="rank">${String(i + 1).padStart(2, '0')}</span>
      <span class="nm">${esc(f.name)}</span>
      <span class="ct">${f.count}</span>
    </div>`).join('') + '</div>';
}

// ─── Entry browser ────────────────────────────────────────────────────
function renderBrowser(container) {
  let decade = 'all';
  let area = 'all';
  let region = 'all';
  let q = '';
  let openId = null;

  const allRegions = regionTotals.map(r => r.name);
  const decadeOptions = ['all'].concat(DECADE_KEYS);

  function entryId(e) { return e.id + '|' + e.year; }

  function getFiltered() {
    const qq = q.trim().toLowerCase();
    return ALL.filter(e => {
      if (decade !== 'all' && e._bucket !== decade) return false;
      if (area !== 'all' && e._area !== area) return false;
      if (region !== 'all' && (e.region || '') !== region) return false;
      if (qq) {
        const hay = (
          e.name + ' ' + e.msc_code + ' ' + (e.parent_branch || '') + ' ' +
          (e.founders || []).join(' ') + ' ' + (e.founding_work || '') + ' ' +
          (e.region || '') + ' ' + (e.description || '')
        ).toLowerCase();
        if (hay.indexOf(qq) === -1) return false;
      }
      return true;
    }).sort((a, b) => a.year - b.year);
  }

  function render() {
    const filtered = getFiltered();

    const filtersHTML = `
      <div class="filters">
        <input id="q-input" placeholder="search name, founder, work, description…" value="${esc(q)}">
        <select id="q-decade">
          ${decadeOptions.map(d =>
            `<option value="${esc(d)}" ${d === decade ? 'selected' : ''}>${d === 'all' ? 'all decades' : esc(d)}</option>`
          ).join('')}
        </select>
        <select id="q-area">
          <option value="all" ${area === 'all' ? 'selected' : ''}>all areas</option>
          ${AREA_DEF.map(a =>
            `<option value="${a.key}" ${area === a.key ? 'selected' : ''}>${esc(a.label)}</option>`
          ).join('')}
        </select>
        <select id="q-region">
          <option value="all" ${region === 'all' ? 'selected' : ''}>all regions</option>
          ${allRegions.map(r =>
            `<option value="${esc(r)}" ${region === r ? 'selected' : ''}>${esc(r)}</option>`
          ).join('')}
        </select>
        <button class="reset" id="q-reset">RESET</button>
        <span class="count-info">${filtered.length} / ${ALL.length} entries</span>
      </div>
    `;

    let rowsHTML;
    if (filtered.length === 0) {
      rowsHTML = `<tr><td colspan="6" class="empty">— no entries match these filters —</td></tr>`;
    } else {
      rowsHTML = filtered.map(e => {
        const id = entryId(e);
        const open = openId === id;
        const a = AREA_BY_KEY[e._area];

        let detail = '';
        if (open) {
          const altsHTML = (e.alternatives && e.alternatives.length > 0)
            ? `<div class="alts">
                 <div class="alts-head">Alternative attributions</div>
                 ${e.alternatives.map(alt => `
                   <div class="a-row">
                     <span class="a-y">${alt.year}</span>
                     <span>${esc(alt.founder)}${alt.work ? ' · ' + esc(alt.work) : ''}${alt.note ? ' (' + esc(alt.note) + ')' : ''}</span>
                   </div>`).join('')}
               </div>`
            : '';
          const sourcesHTML = (e.sources && e.sources.length > 0)
            ? e.sources.map(s => {
                const yr = s.year != null ? ` <span style="color:var(--fg-dim)">· ${yearLabel(s.year)}</span>` : '';
                const body = `${esc(s.author)} — ${esc(s.work)}`;
                return `<div>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${body}</a>` : body}${yr}</div>`;
              }).join('')
            : '';

          detail = `
            <tr class="detail-row">
              <td colspan="6">
                <div class="detail">
                  <div class="desc">${e.description ? esc(e.description) : '<em>(no description)</em>'}</div>
                  <div class="meta">
                    <div class="lbl">Parent branch</div>
                    <div class="val">${esc(e.parent_branch)} <span style="color:var(--fg-dim)">· top ${esc(e.parent_top_msc)}</span></div>
                    <div class="lbl">Founding work</div>
                    <div class="val">${e.founding_work ? esc(e.founding_work) : '<em>—</em>'}</div>
                    <div class="lbl">Decade bucket</div>
                    <div class="val">${esc(e._bucket)}</div>
                    ${e.note ? `<div class="lbl">Note</div><div class="val"><em>${esc(e.note)}</em></div>` : ''}
                    ${sourcesHTML ? `<div class="lbl">Sources</div><div class="val">${sourcesHTML}</div>` : ''}
                  </div>
                  ${altsHTML}
                </div>
              </td>
            </tr>`;
        }

        return `
          <tr class="entry ${open ? 'open' : ''}" data-id="${esc(id)}">
            <td class="yr">${yearLabel(e.year)}</td>
            <td class="msc">${esc(e.msc_code)}</td>
            <td class="nm">${esc(e.name)}</td>
            <td class="fd">${esc((e.founders || []).join(', '))}</td>
            <td class="rg">${esc(e.region || '—')}</td>
            <td class="ar">
              <span class="dot" style="background:${a.color}"></span>
              <span class="ar-label">${esc(a.label)}</span>
            </td>
          </tr>
          ${detail}
        `;
      }).join('');
    }

    container.innerHTML = filtersHTML + `
      <table class="entries">
        <thead>
          <tr>
            <th style="width:70px">Year</th>
            <th style="width:70px">MSC</th>
            <th>Branch</th>
            <th style="width:200px">Founder(s)</th>
            <th style="width:160px">Region</th>
            <th style="width:200px">Area</th>
          </tr>
        </thead>
        <tbody>${rowsHTML}</tbody>
      </table>
    `;

    // wire events
    const qi = container.querySelector('#q-input');
    qi.addEventListener('input', ev => { q = ev.target.value; openId = null; render(); qi.focus(); });
    // restore caret to end after re-render
    setTimeout(() => {
      const el = container.querySelector('#q-input');
      if (el && document.activeElement !== el && q.length > 0) { /* no-op */ }
    }, 0);

    container.querySelector('#q-decade').addEventListener('change', ev => { decade = ev.target.value; openId = null; render(); });
    container.querySelector('#q-area').addEventListener('change', ev => { area = ev.target.value; openId = null; render(); });
    container.querySelector('#q-region').addEventListener('change', ev => { region = ev.target.value; openId = null; render(); });
    container.querySelector('#q-reset').addEventListener('click', () => {
      decade = 'all'; area = 'all'; region = 'all'; q = ''; openId = null; render();
    });

    container.querySelectorAll('tr.entry').forEach(row => {
      row.addEventListener('click', () => {
        const id = row.getAttribute('data-id');
        openId = (openId === id) ? null : id;
        render();
      });
    });
  }

  render();
}

// ─── Footer ───────────────────────────────────────────────────────────
function renderFooter() {
  return `
    <footer class="foot">
      <div><strong>Notes from source metadata.</strong></div>
      <ul>
        ${DATA.metadata.caveats.map(c => `<li>${esc(c)}</li>`).join('')}
      </ul>
      <div style="margin-top:10px">
        Excluded MSC top-level codes (per source): ${DATA.metadata.excluded_msc_top.map(esc).join(' · ')}.
        Granularity: ${esc(DATA.metadata.granularity)}. Window: ${esc(DATA.metadata.coverage_window)}.
      </div>
    </footer>
  `;
}

function mount() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader()}
    <section class="block">
      <div class="block-head">
        <div>
          <div class="num">FIG. 01</div>
          <h2>Founding decade of MSC2020 mid-level codes</h2>
        </div>
        <div class="h-meta">stacked by broad area · pre-1420 separated · click legend to mute</div>
      </div>
      <div id="slot-timeline"></div>
    </section>

    <section class="block">
      <div class="row2">
        <div>
          <div class="block-head">
            <div>
              <div class="num">FIG. 02</div>
              <h2>Top parent branches by entry count</h2>
            </div>
            <div class="h-meta">15 of ${branchTotals.length}</div>
          </div>
          <div id="slot-branches"></div>
        </div>
        <div>
          <div class="block-head">
            <div>
              <div class="num">FIG. 03</div>
              <h2>Geography</h2>
            </div>
            <div class="h-meta">top 12 regions</div>
          </div>
          <div id="slot-regions"></div>
        </div>
      </div>
    </section>

    <section class="block">
      <div class="block-head">
        <div>
          <div class="num">FIG. 04</div>
          <h2>Most-credited founders</h2>
        </div>
        <div class="h-meta">${TOTAL_FOUNDERS} distinct · 588 credits across 504 entries</div>
      </div>
      <div id="slot-founders"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <div>
          <div class="num">FIG. 05</div>
          <h2>Entry browser</h2>
        </div>
        <div class="h-meta">click row for description, sources, alternative attributions</div>
      </div>
      <div id="slot-browser"></div>
    </section>

    ${renderFooter()}
  `;

  renderTimeline(document.getElementById('slot-timeline'));
  renderBranchBars(document.getElementById('slot-branches'));
  renderRegionBars(document.getElementById('slot-regions'));
  renderFounders(document.getElementById('slot-founders'));
  renderBrowser(document.getElementById('slot-browser'));
}

mount();
</script>
